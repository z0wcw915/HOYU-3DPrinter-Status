<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bambu Lab Multi-Printer Dashboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #00ae42;
      --text: #f8fafc;
      --subtext: #94a3b8;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
      margin: 0;
    }
    .container {
      max-width: 1000px;
      width: 100%;
    }
    .grid-printers {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.5rem;
      margin-top: 1.5rem;
    }
    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      padding-bottom: 0.75rem;
      margin-bottom: 1rem;
    }
    .printer-name { font-size: 1.2rem; font-weight: bold; margin: 0; }
    .status-badge {
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      font-weight: bold;
      font-size: 0.75rem;
      text-transform: uppercase;
      background: #334155;
    }
    .RUNNING { background: #15803d; color: #fff; }
    .FINISH { background: #0369a1; color: #fff; }
    .PAUSE { background: #b45309; color: #fff; }
    .OFFLINE { background: #475569; color: #cbd5e1; }
    
    .progress-container { margin: 1rem 0; }
    .progress-bar-bg {
      background: #334155;
      height: 20px;
      border-radius: 10px;
      overflow: hidden;
    }
    .progress-bar-fill {
      background: var(--accent);
      height: 100%;
      width: 0%;
      transition: width 0.5s ease;
    }
    .progress-text {
      display: flex;
      justify-content: space-between;
      margin-top: 0.4rem;
      font-weight: bold;
      font-size: 0.9rem;
    }
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
      margin-top: 1rem;
    }
    .metric {
      background: #0f172a;
      padding: 0.75rem;
      border-radius: 8px;
    }
    .metric-label { font-size: 0.75rem; color: var(--subtext); }
    .metric-value { font-size: 1.1rem; font-weight: bold; margin-top: 0.2rem; }
    .footer { text-align: center; font-size: 0.8rem; color: var(--subtext); margin-top: 2rem; }
  </style>
</head>
<body>
  <div class="container">
    <div style="display:flex; justify-between; align-items:center;">
      <h1 style="margin:0;">Farm Fleet Dashboard</h1>
    </div>

    <div id="printers-grid" class="grid-printers">
      <!-- Dynamic Printer Cards Render Here -->
    </div>

    <div class="footer">Last synced with GitHub: <span id="last-update">Never</span></div>
  </div>

  <script>
    async function updateDashboard() {
      try {
        const res = await fetch(`status.json?t=${Date.now()}`);
        if (!res.ok) return;
        const data = await res.json();

        const grid = document.getElementById('printers-grid');
        grid.innerHTML = ''; // Clear prior entries

        Object.keys(data).forEach(printerKey => {
          const p = data[printerKey];
          
          const cardHtml = `
            <div class="card">
              <div class="header">
                <h3 class="printer-name">${p.name}</h3>
                <span class="status-badge ${p.state}">${p.state}</span>
              </div>
              
              <div style="font-size: 0.85rem; color: var(--subtext); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                File: <strong style="color:var(--text);">${p.filename}</strong>
              </div>

              <div class="progress-container">
                <div class="progress-bar-bg">
                  <div class="progress-bar-fill" style="width: ${p.percent}%;"></div>
                </div>
                <div class="progress-text">
                  <span>Progress</span>
                  <span>${p.percent}%</span>
                </div>
              </div>

              <div class="metrics-grid">
                <div class="metric"><div class="metric-label">ETA Remaining</div><div class="metric-value">${p.remaining_min} min</div></div>
                <div class="metric"><div class="metric-label">Layer</div><div class="metric-value">${p.layer}</div></div>
                <div class="metric"><div class="metric-label">Nozzle Temp</div><div class="metric-value">${p.nozzle_temp} °C</div></div>
                <div class="metric"><div class="metric-label">Bed Temp</div><div class="metric-value">${p.bed_temp} °C</div></div>
              </div>
            </div>
          `;
          grid.innerHTML += cardHtml;
        });

        document.getElementById('last-update').innerText = new Date().toLocaleTimeString();
      } catch (e) {
        console.error("Error updating fleet status:", e);
      }
    }

    setInterval(updateDashboard, 5000);
    updateDashboard();
  </script>
</body>
</html>
